# This file lives ON THE EC2 INSTANCE, not in your local repo's build
# context. It pulls pre-built images from ECR rather than building them
# locally, and points the backend at RDS instead of a local "db" container.

services:
  backend:
    image: ${ECR_REGISTRY}/taskpilot-backend:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: ${ECR_REGISTRY}/taskpilot-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
